<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - ORM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

    <!-- Navegación Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-boxes-stacked me-2"></i>Gestión de
                Inventario</a>
        </div>
    </nav>

    <div class="container my-4">

        <!-- Pestañas de Navegación -->
        <ul class="nav nav-pills nav-fill mb-4 shadow-sm bg-white p-2 rounded" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="categorias-tab" data-bs-toggle="tab"
                    data-bs-target="#categorias" type="button"><i class="fa-solid fa-tags me-2"></i>Categorías</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="productos-tab" data-bs-toggle="tab" data-bs-target="#productos"
                    type="button"><i class="fa-solid fa-box me-2"></i>Productos</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="entradas-tab" data-bs-toggle="tab" data-bs-target="#entradas"
                    type="button"><i class="fa-solid fa-truck-ramp-box me-2"></i>Entradas</button>
            </li>
        </ul>

        <!-- Contenido de las Pestañas -->
        <div class="tab-content" id="mainTabsContent">

            <!-- 1. SECCIÓN CATEGORÍAS -->
            <div class="tab-pane fade show active" id="categorias" role="tabpanel">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white fw-bold"><i class="fa-solid fa-plus me-1 text-primary"></i>
                                Nueva Categoría</div>
                            <div class="card-body">
                                <form id="form-categoria">
                                    <div class="mb-3">
                                        <label class="form-label">Nombre</label>
                                        <input type="text" id="cat-nombre" class="form-control"
                                            placeholder="Ej. Electrónica" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Descripción</label>
                                        <textarea id="cat-descripcion" class="form-control" rows="3"
                                            placeholder="Descripción corta"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100"><i
                                            class="fa-solid fa-floppy-disk me-1"></i> Guardar Categoría</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white fw-bold"><i class="fa-solid fa-list me-1 text-primary"></i>
                                Listado de Categorías</div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Nombre</th>
                                                <th>Descripción</th>
                                                <th class="text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabla-categorias"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. SECCIÓN PRODUCTOS -->
            <div class="tab-pane fade" id="productos" role="tabpanel">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white fw-bold"><i class="fa-solid fa-plus me-1 text-success"></i>
                                Nuevo Producto</div>
                            <div class="card-body">
                                <form id="form-producto">
                                    <div class="mb-3">
                                        <label class="form-label">Nombre</label>
                                        <input type="text" id="prod-nombre" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Precio</label>
                                        <input type="number" step="0.01" id="prod-precio" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Stock Mínimo</label>
                                        <input type="number" id="prod-stock" class="form-control" value="5" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Categoría</label>
                                        <select id="prod-categoria" class="form-select" required>
                                            <option value="">Seleccione una categoría</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Descripción</label>
                                        <textarea id="prod-descripcion" class="form-control" rows="2"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100"><i
                                            class="fa-solid fa-floppy-disk me-1"></i> Guardar Producto</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white fw-bold"><i class="fa-solid fa-list me-1 text-success"></i>
                                Listado de Productos</div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Nombre</th>
                                                <th>Precio</th>
                                                <th>Categoría</th>
                                                <th class="text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabla-productos"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. SECCIÓN ENTRADAS -->
            <div class="tab-pane fade" id="entradas" role="tabpanel">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white fw-bold"><i class="fa-solid fa-plus me-1 text-warning"></i>
                                Registrar Entrada</div>
                            <div class="card-body">
                                <form id="form-entrada">
                                    <div class="mb-3">
                                        <label class="form-label">Producto</label>
                                        <select id="ent-producto" class="form-select" required>
                                            <option value="">Seleccione un producto</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Cantidad</label>
                                        <input type="number" id="ent-cantidad" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Factura</label>
                                        <input type="text" id="ent-factura" class="form-control" placeholder="FAC-001"
                                            required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Stand</label>
                                        <input type="text" id="ent-stand" class="form-control" placeholder="A1"
                                            required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Ubicación</label>
                                        <input type="text" id="ent-ubicacion" class="form-control"
                                            placeholder="Bodega Principal" required>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 text-dark fw-bold"><i
                                            class="fa-solid fa-floppy-disk me-1"></i> Guardar Entrada</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white fw-bold"><i class="fa-solid fa-list me-1 text-warning"></i>
                                Registro de Entradas</div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Producto</th>
                                                <th>Cantidad</th>
                                                <th>Factura</th>
                                                <th>Ubicación</th>
                                                <th class="text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabla-entradas"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
